[package]
name = "tdm-bench"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Black-box ranged-download benchmark against tdm-labserver"
publish = false

[dependencies]
tdm-labserver = { path = "../tdm-labserver" }
clap = { version = "4.6.7", features = ["derive"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream"] }
tokio = { version = "1.54.1", features = ["full"] }
sha2 = "0.10.9"
hex = "0.4.3"
serde_json = "1.0.154"
