[package]
name = "tdm-store"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Durable JSON state files: atomic replace, lifecycle backups and corrupt-file recovery"

[dependencies]
tempfile = "3.27.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tracing = "0.1.44"
