# CI is paused while the phases are being completed.
#
# On every push and pull request this workflow only prints a message. It does not
# build, test or release anything. The full Windows and Linux build is kept below,
# commented out. To turn it back on: uncomment the block and delete the placeholder job.

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  paused:
    name: CI paused
    runs-on: ubuntu-22.04
    steps:
      - run: echo "CI build is paused until all phases are complete. Nothing was built."

