# CI: builds the app on every push and pull request, on Windows, Linux and macOS.
# Release packaging lives in release.yml.

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # build.rs runs extension/build.mjs with Node.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Linux GUI libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libx11-dev \
            libxcursor-dev libxi-dev libxrandr-dev libfontconfig1-dev

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release
