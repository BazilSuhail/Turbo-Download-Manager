# Release is paused while the phases are being completed.
#
# Pushes and tags no longer build or publish anything. This workflow only prints a
# message when it is started by hand (Actions tab > Release > Run workflow).
# The full release pipeline is kept below, commented out. To turn it back on:
# uncomment the block, delete the placeholder job, and restore the tag trigger.

name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paused:
    name: Release paused
    runs-on: ubuntu-22.04
    steps:
      - run: echo "Release is paused until all phases are complete. Nothing was built or published."

