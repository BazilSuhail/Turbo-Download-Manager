<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TDM</title>
    <link rel="stylesheet" href="ui.css" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="row spread top">
      <div class="brand">
        <svg class="mark" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
          <defs>
            <linearGradient id="tdm-flame" x1="0" y1="1" x2="1" y2="0">
              <stop offset="0" stop-color="#ff7a1a" />
              <stop offset="1" stop-color="#ffb347" />
            </linearGradient>
          </defs>
          <rect width="32" height="32" rx="9" fill="url(#tdm-flame)" />
          <path d="M16 6.5c1.3 3.3 5.6 5.6 5.6 11.1a5.6 5.6 0 0 1-11.2 0c0-2.5 1.1-4.4 2.6-5.7.2 1.9 1 3.1 2.1 3.7-.6-3.6.2-6.6.9-9.1z" fill="#1c1a19" />
          <path d="M16 15.2c.9 1.6 2.7 2.6 2.7 4.8a2.7 2.7 0 0 1-5.4 0c0-1.2.5-2.1 1.2-2.8.1.9.5 1.5 1 1.8-.3-1.7.1-3.1.5-3.8z" fill="#ffb347" />
        </svg>
        <div>
          <h1>TDM</h1>
          <small>Download capture</small>
        </div>
      </div>
      <span class="pill" role="status" aria-live="polite">
        <span class="dot" id="dot"></span>
        <span id="state">Checking…</span>
      </span>
    </header>

    <section class="card row spread">
      <label for="enabled" class="grow">
        <strong>Auto-capture downloads</strong>
        <span class="hint">Hand matching downloads to TDM</span>
      </label>
      <span class="switch"><input id="enabled" type="checkbox" role="switch" /><span></span></span>
    </section>

    <section class="card incog">
      <div class="row">
        <span class="dot" id="incogDot"></span>
        <p class="incog-text" id="incogText">Checking private windows…</p>
      </div>
      <button id="incogBtn" class="btn" type="button" hidden>Open settings</button>
    </section>

    <section class="card">
      <div class="row spread">
        <strong>Media on this page</strong>
        <span id="count" class="count"></span>
      </div>
      <ul id="media" aria-live="polite"></ul>
      <p id="empty" class="hint" hidden></p>
      <div id="grant" class="grant" hidden>
        <p class="hint">
          Turn on media detection to catch streamed video (HLS/DASH) and show a
          download button when you hover a video.
        </p>
        <button id="grantMedia" class="btn primary" type="button">Enable media detection</button>
      </div>
    </section>

    <footer class="row spread">
      <span id="hostVersion" class="hint"></span>
      <span class="row">
        <button id="reconnect" class="btn small" type="button" hidden>Reconnect</button>
        <a href="#" id="options">Settings</a>
      </span>
    </footer>

    <template id="item">
      <li>
        <span class="badge"></span>
        <span class="name">
          <span class="title"></span>
          <span class="where"></span>
        </span>
        <button class="btn primary" type="button">Download</button>
      </li>
    </template>

    <script type="module" src="popup.js"></script>
  </body>
</html>
