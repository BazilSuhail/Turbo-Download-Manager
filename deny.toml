# cargo-deny policy for Turbo Download Manager.
# The project is licensed MIT OR Apache-2.0. Do not copy GPL (or other
# copyleft) code into the tree; its license would conflict with ours.

[graph]
all-features = false

[licenses]
# Permissive licenses only. Anything else fails `cargo deny check licenses`.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "0BSD",
    "BSL-1.0",
]

[advisories]
vulnerability = "deny"
unmaintained = "workspace"

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
